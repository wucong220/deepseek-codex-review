name: Regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -X utf8 -B -m unittest discover -s tests -v
      - run: node --test tests/test_host_tool.mjs
